<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF0002">
  <meta name="description" content="Find Voodoo Doll across social media.">
  <title>Voodoo Doll</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="video-background" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto">
      <source src="./Background.mp4" type="video/mp4">
    </video>
  </div>

  <main class="page-shell">
    <section class="page-section title-section" id="top" aria-labelledby="page-title">
      <div class="section-inner title-panel playful-panel">
        <h1 id="page-title" class="site-title accent" aria-label="Voodoo Doll">Voodoo Doll</h1>
        <p class="intro">Graphic Designer | Game Developer | CEO & Founder of Collapse Studios</p>
      </div>
    </section>

    <section class="page-section portfolio-section" id="portfolio" aria-labelledby="portfolio-title">
      <div class="section-inner portfolio-panel playful-panel">
        <div class="portfolio-heading-row">
          <div>
            <h2 id="portfolio-title"><span class="accent">Portfolio</span></h2>
          </div>
        </div>

        <div class="portfolio-grid">
          <article class="portfolio-card portfolio-icons">
            <h3>Icons</h3>
            <div class="artwork-grid artwork-grid-icons">
              <button class="artwork-thumb" type="button" data-full="./Portfolio/Icons/1.png" aria-label="View icon artwork 1"><img src="./Portfolio/Icons/1.png" alt="Purple anatomical illustration" loading="lazy"></button>
              <button class="artwork-thumb" type="button" data-full="./Portfolio/Icons/2.png" aria-label="View icon artwork 2"><img src="./Portfolio/Icons/2.png" alt="Dark winged figure illustration" loading="lazy"></button>
              <button class="artwork-thumb" type="button" data-full="./Portfolio/Icons/3.png" aria-label="View icon artwork 3"><img src="./Portfolio/Icons/3.png" alt="Monochrome portrait illustration" loading="lazy"></button>
              <button class="artwork-thumb" type="button" data-full="./Portfolio/Icons/4.png" aria-label="View icon artwork 4"><img src="./Portfolio/Icons/4.png" alt="Pink anime-inspired illustration" loading="lazy"></button>
              <button class="artwork-thumb" type="button" data-full="./Portfolio/Icons/5.png" aria-label="View icon artwork 5"><img src="./Portfolio/Icons/5.png" alt="Blue-toned portrait illustration" loading="lazy"></button>
              <button class="artwork-thumb" type="button" data-full="./Portfolio/Icons/6.png" aria-label="View icon artwork 6"><img src="./Portfolio/Icons/6.png" alt="Red and white wing illustration" loading="lazy"></button>
              <button class="artwork-thumb" type="button" data-full="./Portfolio/Icons/7.png" aria-label="View icon artwork 7"><img src="./Portfolio/Icons/7.png" alt="" loading="lazy"></button>
              <button class="artwork-thumb" type="button" data-full="./Portfolio/Icons/8.png" aria-label="View icon artwork 8"><img src="./Portfolio/Icons/8.png" alt="" loading="lazy"></button>
              <button class="artwork-thumb" type="button" data-full="./Portfolio/Icons/9.png" aria-label="View icon artwork 9"><img src="./Portfolio/Icons/9.png" alt="" loading="lazy"></button>
            </div>
          </article>

          <article class="portfolio-card portfolio-posters">
            <h3>Posters</h3>
            <div class="artwork-grid artwork-grid-posters">
              <button class="artwork-thumb" type="button" data-full="./Portfolio/Posters/1.png" aria-label="View poster artwork 1"><img src="./Portfolio/Posters/1.png" alt="Blue and white illustrated poster" loading="lazy"></button>
              <button class="artwork-thumb" type="button" data-full="./Portfolio/Posters/2.png" aria-label="View poster artwork 2"><img src="./Portfolio/Posters/2.png" alt="Colorful collage-style illustrated poster" loading="lazy"></button>
              <button class="artwork-thumb" type="button" data-full="./Portfolio/Posters/3.png" aria-label="View poster artwork 3"><img src="./Portfolio/Posters/3.png" alt="Yellow and red typographic poster" loading="lazy"></button>
            </div>
          </article>

          <article class="portfolio-card portfolio-type">
            <h3>Typography</h3>
            <div class="artwork-grid artwork-grid-type">
              <button class="artwork-thumb" type="button" data-full="./Portfolio/Typography/1.png" aria-label="View typography artwork 1"><img src="./Portfolio/Typography/1.png" alt="White experimental lettering on black" loading="lazy"></button>
              <button class="artwork-thumb" type="button" data-full="./Portfolio/Typography/2.png" aria-label="View typography artwork 2"><img src="./Portfolio/Typography/2.png" alt="Gold ornamental experimental lettering" loading="lazy"></button>
            </div>
          </article>
        </div>
      </div>
    </section>

    <dialog class="artwork-lightbox" aria-label="Artwork preview">
      <button class="lightbox-close" type="button" aria-label="Close artwork preview">×</button>
      <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous artwork">‹</button>
      <img class="lightbox-image" src="" alt="">
      <button class="lightbox-nav lightbox-next" type="button" aria-label="Next artwork">›</button>
      <p class="lightbox-caption" aria-live="polite"></p>
    </dialog>

    <section class="page-section links-section" id="links" aria-labelledby="links-title">
      <div class="section-inner links-panel playful-panel">
        <h2 id="links-title"><span class="accent">Links</span></h2>
        <nav class="social-links" aria-label="Social media links">
          <a href="https://www.linkedin.com/in/voodoo-doll-71b1113a8/" target="_blank" rel="noopener noreferrer">
            <span class="social-icon">ⓘ</span><span>LinkedIn</span><span class="arrow">↗</span>
          </a>
          <a href="https://www.instagram.com/whoisvoodoodoll/" target="_blank" rel="noopener noreferrer">
            <span class="social-icon">◎</span><span>Instagram</span><span class="arrow">↗</span>
          </a>
          <a href="https://www.pinterest.com/VoodooExe/" target="_blank" rel="noopener noreferrer">
            <span class="social-icon">℗</span><span>Pinterest</span><span class="arrow">↗</span>
          </a>
          <a href="https://t.me/VoodooExe" target="_blank" rel="noopener noreferrer">
            <span class="social-icon">➤</span><span>Telegram</span><span class="arrow">↗</span>
          </a>
          <a href="mailto:weirdvoodoochild@gmail.com">
            <span class="social-icon">✉</span><span>Email</span><span class="arrow">↗</span>
          </a>
        </nav>
        <footer>
          <p>© <span id="year"></span> Voodoo Doll</p>
          <p>Vibecoded via ChatGPT</p>
        </footer>
      </div>
    </section>

  </main>
</body>
</html>
