<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find Voodoo Doll across social media.">
  <title>Voodoo Doll | Socials</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="eyebrow">
      <span class="dot"></span>
      FIND ME ONLINE
    </div>

    <h1>Voodoo Doll<span class="accent">.</span></h1>
    <p class="intro">
      Find me across the internet. Follow, connect, and stay in touch.
    </p>

    <div class="social-links">
      <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
        <span class="social-icon">▶</span>
        <span>YouTube</span>
        <span class="arrow">↗</span>
      </a>

      <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
        <span class="social-icon">◎</span>
        <span>Instagram</span>
        <span class="arrow">↗</span>
      </a>

      <a href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">
        <span class="social-icon">♪</span>
        <span>TikTok</span>
        <span class="arrow">↗</span>
      </a>

      <a href="https://x.com/" target="_blank" rel="noopener noreferrer">
        <span class="social-icon">𝕏</span>
        <span>X (Twitter)</span>
        <span class="arrow">↗</span>
      </a>

      <a href="https://discord.com/" target="_blank" rel="noopener noreferrer">
        <span class="social-icon">◈</span>
        <span>Discord</span>
        <span class="arrow">↗</span>
      </a>

      <a href="https://github.com/VoodooChild1989" target="_blank" rel="noopener noreferrer">
        <span class="social-icon">⌘</span>
        <span>GitHub</span>
        <span class="arrow">↗</span>
      </a>

      <a href="https://t.me/" target="_blank" rel="noopener noreferrer">
        <span class="social-icon">➤</span>
        <span>Telegram</span>
        <span class="arrow">↗</span>
      </a>

      <a href="mailto:your@email.com">
        <span class="social-icon">✉</span>
        <span>Email</span>
        <span class="arrow">↗</span>
      </a>
    </div>

    <footer>
      <span>© Voodoo Doll</span>
      <span id="year"></span>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
