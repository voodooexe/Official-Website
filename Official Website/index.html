<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A tiny static site for testing GitHub Pages hosting.">
  <title>Hello, GitHub Pages!</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="eyebrow"><span class="dot"></span> STATIC SITE · LIVE ON THE WEB</div>
    <h1>It works<span class="accent">.</span></h1>
    <p class="intro">Your GitHub Pages test site is ready. If you can read this page, your static hosting is working.</p>
    <div class="status">
      <span class="status-icon">✓</span>
      <div>
        <strong>All systems go</strong>
        <small>HTML, CSS and JavaScript loaded successfully</small>
      </div>
    </div>
    <button id="test-button" type="button">Test the button <span aria-hidden="true">→</span></button>
    <p id="message" class="message" aria-live="polite">Click the button to test JavaScript.</p>
    <footer>
      <span>Made for your GitHub Pages test</span>
      <span id="year"></span>
    </footer>
  </main>
</body>
</html>
